<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Base / logs -->
  <ellipse cx="16" cy="26" rx="9" ry="2.5" fill="#3a2008" opacity="0.9"/>
  <rect x="7" y="23" width="5" height="3.5" rx="1.5" fill="#5a3010" transform="rotate(-18 10 24.5)"/>
  <rect x="20" y="23" width="5" height="3.5" rx="1.5" fill="#5a3010" transform="rotate(18 22 24.5)"/>
  <rect x="11" y="22" width="10" height="3" rx="1.5" fill="#6b3a14"/>

  <!-- Ember glow -->
  <ellipse cx="16" cy="23" rx="6" ry="2" fill="#ff6a00" opacity="0.35"/>

  <!-- Main flame — back layer -->
  <path d="M16 22 C13 18 11 14 13 10 C14 8 13 6 14 4 C15 7 16 8 17 6 C18 4 19 7 19 9 C21 13 19 18 16 22Z"
        fill="#ff4500" opacity="0.7"/>

  <!-- Main flame — mid layer -->
  <path d="M16 22 C14 18 13 15 14 12 C15 10 15 8 16 7 C17 8 17 10 18 12 C19 15 18 18 16 22Z"
        fill="#ff7b00" opacity="0.85"/>

  <!-- Core flame — bright -->
  <path d="M16 21 C15 18 15 15 16 13 C17 15 17 18 16 21Z"
        fill="#ffe066" opacity="0.95"/>

  <!-- Small side flicker left -->
  <path d="M13 20 C12 17 12 15 13 13 C13.5 15 14 17 13 20Z"
        fill="#ff6a00" opacity="0.6"/>

  <!-- Small side flicker right -->
  <path d="M19 20 C20 17 20 15 19 13 C18.5 15 18 17 19 20Z"
        fill="#ff6a00" opacity="0.6"/>

  <!-- Sparks -->
  <circle cx="12" cy="10" r="0.9" fill="#ffe066" opacity="0.8"/>
  <circle cx="20" cy="8"  r="0.7" fill="#ffaa00" opacity="0.7"/>
  <circle cx="17" cy="5"  r="0.6" fill="#fff0a0" opacity="0.9"/>
  <circle cx="14" cy="6"  r="0.5" fill="#ffe066" opacity="0.6"/>
</svg>
